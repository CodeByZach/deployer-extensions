name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Actions are pinned by .github/workflows/actions.lock, which GitHub enforces when the
# workflow runs. Rerun `gh actions-lock` after changing any `uses:`.
jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ', lowest dependencies' || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false # report every combination
      matrix:
        php: ['8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.4'
            lowest: true

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # this job never pushes

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Because every leg runs `composer update`, the committed lock file is otherwise
      # never exercised; this is what catches it drifting from composer.json.
      - name: Validate composer.json
        run: composer validate --strict

      # `update`, not `install`: the lock file is resolved on one PHP version, so
      # installing it everywhere would test the same dependency set twice rather than
      # proving the declared constraints hold across the supported range. The newest
      # versions run on every PHP version, the oldest allowed ones on the lowest.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}

      - name: Static analysis
        run: composer phpstan

      - name: Code style
        run: composer check

      - name: Tests
        run: composer test

      # Executes real tasks against localhost. Every runtime bug this package has had
      # was invisible to the three steps above and caught only by actually running one.
      - name: Smoke test
        run: composer smoke

  # The check branch rules require: passes only if every test job passed, so the
  # required checks stay the same when the PHP versions change.
  ci:
    name: CI
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Check that every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
